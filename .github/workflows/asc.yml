name: App Store (API)
on:
  push:
    branches: [ci-asc]
  workflow_dispatch:
    inputs:
      islem:
        description: "setup = mağaza bilgileri ve ekran görüntüleri · status · submit = yapıyı bağla ve incelemeye gönder · ship = yapıyı bekle + submit"
        required: true
        default: status
        type: choice
        options: [status, setup, submit, ship, withdraw]
      app_id:
        description: "App Store Connect uygulama kimliği (boş bırakılırsa paket kimliğinden bulunur)"
        required: false
      surum:
        description: "Sürüm numarası"
        required: true
        default: "1.0.0"
      yayin:
        description: "Onaydan sonra: MANUAL (elle yayınla) / AFTER_APPROVAL (otomatik)"
        required: false
        default: AFTER_APPROVAL
permissions:
  contents: write

jobs:
  asc:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      GITHUB_WORKFLOW_SLUG: asc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyjwt cryptography requests
      - name: Anahtar
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "${{ secrets.APP_STORE_KEY_P8 }}" > "$RUNNER_TEMP/keys/key.p8"
      - name: Çalıştır
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_KEY_PATH: ${{ runner.temp }}/keys/key.p8
          APP_ID: ${{ inputs.app_id }}
          VERSION: ${{ inputs.surum }}
          RELEASE_TYPE: ${{ inputs.yayin }}
        run: |
          set -o pipefail
          ISLEM="${{ inputs.islem }}"
          if [ -z "$ISLEM" ] && [ -f ci/asc.env ]; then set -a; . ci/asc.env; set +a; fi
          python -u scripts/asc_gece.py "$ISLEM" 2>&1 | tee -a "$RUNNER_TEMP/log.txt"
      - name: Günlüğü depoya kaydet
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STEPS: ${{ toJSON(steps) }}
          KID: ${{ secrets.APP_STORE_KEY_ID }}
          ISS: ${{ secrets.APP_STORE_ISSUER_ID }}
          TID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          L="$RUNNER_TEMP/log.txt"; [ -f "$L" ] || echo "(günlük yok)" > "$L"
          for v in "$KID" "$ISS" "$TID"; do [ -n "$v" ] && sed -i.bak "s|$v|***|g" "$L"; done
          D="$RUNNER_TEMP/logs"; mkdir -p "$D"; cd "$D"; git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          if git fetch -q --depth 1 origin ci-logs; then git checkout -q -b ci-logs FETCH_HEAD; else git checkout -q --orphan ci-logs; fi
          F="${GITHUB_WORKFLOW_SLUG}-${GITHUB_RUN_NUMBER}.txt"
          { echo "durum: ${{ job.status }}"; echo "adımlar: $STEPS"; echo "-----"; tail -c 300000 "$L"; } > "$F"
          cp "$F" "son-${GITHUB_WORKFLOW_SLUG}.txt"
          git add -A; git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "günlük $F"
          for i in 1 2 3; do git push -q origin ci-logs && break; sleep 3; git fetch -q --depth 1 origin ci-logs && git rebase -q FETCH_HEAD; done

      - name: Anahtarı temizle
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
