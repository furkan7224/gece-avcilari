name: App Store (API)
on:
  push:
    branches: [ci-asc]
  workflow_dispatch:
    inputs:
      islem:
        description: "setup = mağaza bilgileri ve ekran görüntüleri · status · submit = yapıyı bağla ve incelemeye gönder · ship = yapıyı bekle + submit"
        required: true
        default: status
        type: choice
        options: [status, setup, submit, ship, withdraw]
      app_id:
        description: "App Store Connect uygulama kimliği (boş bırakılırsa paket kimliğinden bulunur)"
        required: false
      surum:
        description: "Sürüm numarası"
        required: true
        default: "1.0.0"
      yayin:
        description: "Onaydan sonra: MANUAL (elle yayınla) / AFTER_APPROVAL (otomatik)"
        required: false
        default: AFTER_APPROVAL
permissions:
  contents: write

defaults:
  run:
    shell: bash scripts/run.sh {0}

jobs:
  asc:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      GITHUB_WORKFLOW_SLUG: asc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyjwt cryptography requests
      - name: Anahtar
        id: s01
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "${{ secrets.APP_STORE_KEY_P8 }}" > "$RUNNER_TEMP/keys/key.p8"
      - name: Çalıştır
        id: s02
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_KEY_PATH: ${{ runner.temp }}/keys/key.p8
          APP_ID: ${{ inputs.app_id }}
          VERSION: ${{ inputs.surum }}
          RELEASE_TYPE: ${{ inputs.yayin }}
        run: |
          set -o pipefail
          ISLEM="${{ inputs.islem }}"
          if [ -z "$ISLEM" ] && [ -f ci/asc.env ]; then set -a; . ci/asc.env; set +a; fi
          python -u scripts/asc_gece.py "$ISLEM"
      - name: Günlüğü depoya kaydet
        id: s03
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STEPS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
          SLUG: asc
          KID: ${{ secrets.APP_STORE_KEY_ID }}
          ISS: ${{ secrets.APP_STORE_ISSUER_ID }}
          TID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: python3 scripts/ci_log.py

      - name: Anahtarı temizle
        shell: bash
        id: s04
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
